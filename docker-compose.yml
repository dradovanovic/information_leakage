services:
  subliminal_learning:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subliminal_learning
    ports:
      - "8050:8050"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - DASH_DEBUG_MODE=True
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - TF_CPP_MIN_LOG_LEVEL=2  # Suppress verbose TensorFlow logs
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
