# CPU:  docker compose run --rm leakage python run_leakage.py --synthetic --seeds 2
# GPU:  docker compose --profile gpu run --rm leakage-gpu python run_leakage.py ...
services:
  leakage:
    build:
      context: .
      args:
        TORCH_VARIANT: cpu
    image: information-leakage:cpu
    volumes:
      - .:/app
    working_dir: /app
    shm_size: "2gb"

  leakage-gpu:
    profiles: ["gpu"]
    build:
      context: .
      args:
        TORCH_VARIANT: cu128
    image: information-leakage:gpu
    volumes:
      - .:/app
    working_dir: /app
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
